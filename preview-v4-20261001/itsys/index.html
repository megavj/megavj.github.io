<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프리미엄 전산답변기로 이동</title>
  <meta name="description" content="188본부 프리미엄 전산답변기">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4ede1">
  <style>
    /* 이동 안내 화면 — 색·모양은 /preview-v4-20261001/assets/design-tokens.css 의 188 Signature v4 와 같은 값(이동이 늦어지지 않게 직접 적음) */
    :root { color-scheme:dark; font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      color:#f5f2ea;
      background:radial-gradient(70% 50% at 50% -10%, rgba(232,201,106,.14), transparent 62%), #050607;
      -webkit-font-smoothing:antialiased;
    }
    .card {
      position:relative;
      width:min(460px, 100%);
      border:1px solid rgba(232,201,106,.32);
      border-radius:24px;
      background:radial-gradient(90% 120% at 50% 0%, rgba(232,201,106,.14), transparent 60%), linear-gradient(180deg,#111318,#0a0b0e);
      box-shadow:0 30px 80px rgba(0,0,0,.45);
      padding:32px 26px 28px;
      text-align:center;
    }
    .mark {
      width:44px;
      height:44px;
      display:grid;
      place-items:center;
      margin:0 auto 16px;
      border:1px solid rgba(232,201,106,.55);
      border-radius:12px;
      color:#e8c96a;
      font:400 14px/1 Marcellus,Georgia,serif;
      background:radial-gradient(120% 120% at 30% 0%, rgba(255,241,196,.24), transparent 60%), #0d0f13;
    }
    p { margin:0 0 20px; color:rgba(245,242,234,.8); line-height:1.65; font-size:15px; word-break:keep-all; }
    a {
      min-height:50px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 26px;
      border-radius:999px;
      border:1px solid rgba(255,241,196,.75);
      color:#17120a;
      background:linear-gradient(180deg,#f8ebc0 0%,#e6c66f 44%,#bf983a 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 12px 30px rgba(201,162,39,.25);
      text-decoration:none;
      font-size:15px;
      font-weight:800;
    }
    a:focus-visible { outline:2px solid #e8c96a; outline-offset:3px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">188</div>
    <p>프리미엄 전산답변기로 이동 중입니다.</p>
    <p><a id="itsysLink" href="#">바로 열기</a></p>
  </main>
  <script>
    const itsysUrl = 'https://script.google.com/macros/s/AKfycbzVbO8_XxSq8_WZhvNBXSi0myH22g0igqhAwkz7Kf9QtDUchxIds-E7fgTi06xGSP6lvg/exec';
    document.getElementById('itsysLink').href = itsysUrl;
    window.location.replace(itsysUrl);
  </script>
</body>
</html>
