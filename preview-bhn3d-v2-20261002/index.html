<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>보험노트 3D 책 — 시안 미리보기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" crossorigin>
<link rel="stylesheet" href="hero3d.css">
<style>
  :root { --bg: #ffffff; --fg: #222; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    transition: background .3s, color .3s;
    min-height: 100vh;
  }
  body.checker {
    background-color: #fff;
    background-image: linear-gradient(45deg, #e6e6e6 25%, transparent 25%), linear-gradient(-45deg, #e6e6e6 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e6e6e6 75%), linear-gradient(-45deg, transparent 75%, #e6e6e6 75%);
    background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  }
  .bar {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end;
    font-size: 12px; background: rgba(255,255,255,.85); border: 1px solid rgba(0,0,0,.1);
    padding: 6px 8px; border-radius: 10px; backdrop-filter: blur(6px); color: #333;
  }
  .bar button {
    font: inherit; border: 1px solid rgba(0,0,0,.18); border-radius: 7px; padding: 4px 9px; cursor: pointer; background: #fff;
  }
  .bar button .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.25); }
  .bar button[aria-pressed="true"] { border-color: #b8893a; box-shadow: 0 0 0 2px rgba(184,137,58,.25); }
  .tag { opacity: .6; margin-right: 4px; }
  /* 실제 홈페이지 첫 화면 비슷한 배치 (시안 확인용) */
  .hero {
    max-width: 1180px; margin: 0 auto; padding: 72px 24px 40px;
    display: grid; grid-template-columns: 1fr 1.25fr; gap: 24px; align-items: center;
  }
  .hero h1 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 12px; letter-spacing: -0.02em; }
  .hero p { margin: 0; opacity: .7; line-height: 1.6; }
  .hero .slot { width: 100%; max-width: 760px; justify-self: center; }
  .hint { text-align: center; font-size: 13px; opacity: .55; margin: 8px 0 0; }
  .ctrl { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .ctrl button { font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; opacity: .7; cursor: pointer; }
  .info { max-width: 760px; margin: 24px auto 60px; font-size: 12px; opacity: .55; text-align: center; padding: 0 16px; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding-top: 84px; text-align: center; } }
</style>
</head>
<body>
  <div class="bar" role="group" aria-label="배경 바꾸기">
    <span class="tag">배경</span>
    <button data-bg="#ffffff" aria-pressed="true"><span class="sw" style="background:#fff"></span>흰색</button>
    <button data-bg="#f5f2ec"><span class="sw" style="background:#f5f2ec"></span>밝은 베이지</button>
    <button data-bg="#eef2f6"><span class="sw" style="background:#eef2f6"></span>밝은 회청</button>
    <button data-bg="#14161b" data-dark><span class="sw" style="background:#14161b"></span>어두운색</button>
    <button data-bg="checker"><span class="sw" style="background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0/6px 6px"></span>투명 확인</button>
  </div>

  <main class="hero">
    <div>
      <h1>보험, 제대로 알고<br>고르는 노트</h1>
      <p>(시안용 자리 글) 실제 홈페이지 문구와 배치는 바뀌지 않습니다.<br>오른쪽 3D 책만 메인 이미지 자리에 들어갈 예정입니다.</p>
    </div>
    <div class="slot">
      <!-- ▼ 실제 홈페이지에 넣을 부분 (embed.md 참고) -->
      <div class="bhn-hero3d" data-bhn-hero3d>
        <picture class="bhn-hero3d__poster">
          <source srcset="poster.webp" type="image/webp">
          <img src="poster.png" alt="보험노트 — 당신의 최고의 선택" width="1200" height="900" decoding="async" fetchpriority="high">
        </picture>
      </div>
      <!-- ▲ -->
      <p class="hint">클릭/탭하면 한 장 넘어갑니다 (왼쪽 페이지는 이전 장) · 휴대폰은 좌우로 밀기 · 가만히 두면 천천히 자동으로 넘어갑니다</p>
      <div class="ctrl"><button id="prev">◀ 이전</button><button id="next">다음 ▶</button></div>
    </div>
  </main>
  <p class="info" id="info">시안 미리보기 · 검색 노출 안 됨(noindex) · 주소 끝에 <code>?low=1</code> 저사양 모드, <code>?motion=reduce</code> 움직임 줄이기 모드</p>

<script>
  // 배경 바꾸기 (투명 배경 확인용)
  document.querySelectorAll('.bar button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.bar button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    const v = b.dataset.bg;
    document.body.classList.toggle('checker', v === 'checker');
    document.documentElement.style.setProperty('--bg', v === 'checker' ? '#fff' : v);
    document.documentElement.style.setProperty('--fg', 'dark' in b.dataset ? '#eee' : '#222');
  }));
</script>
<script type="module">
  import './hero3d.js';
  const el = document.querySelector('[data-bhn-hero3d]');
  const api = () => el.__bhnHero;
  document.getElementById('next').onclick = () => api()?.next();
  document.getElementById('prev').onclick = () => api()?.prev();
  setTimeout(() => {
    const i = api()?.info;
    if (i) document.getElementById('info').insertAdjacentText('beforeend', ` · 현재: ${i.low ? '저사양' : '일반'} 모드${i.reduced ? ', 움직임 줄이기' : ''}`);
    else if (el.classList.contains('is-fallback')) document.getElementById('info').insertAdjacentText('beforeend', ' · WebGL 사용 불가 → 정지 이미지 표시 중');
  }, 1500);
</script>
</body>
</html>
